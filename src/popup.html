<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Link-a-roo</title>
    <link rel="stylesheet" href="theme.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="stripe"></div>
    <div class="header">
      <div class="brand">
        <img src="../icons/lasso-small.svg" alt="" />
        <h1>Link<span class="hy">-</span>a<span class="hy">-</span>roo</h1>
      </div>
      <button class="settings-btn" id="open-settings">Settings</button>
    </div>

    <div class="content">
      <div class="search-top">
        <textarea
          id="term"
          rows="1"
          placeholder="search term"
          autocomplete="off"
          spellcheck="false"
        ></textarea>
      </div>
      <div class="btn-grid" id="dest-buttons"></div>
      <p class="shortcuts-tip" id="shortcuts-tip" hidden>
        <span>Partner, those links ain't gonna harness themselves. <a href="#" id="shortcuts-tip-link">Configure settings</a></span>
        <button class="tip-dismiss" id="shortcuts-tip-close" title="Dismiss" aria-label="Dismiss">✕</button>
      </p>

      <div class="empty-cta" id="search-empty" hidden>
        <img class="empty-mark" src="../icons/lasso.svg" alt="" />
        <p class="empty-title">No destinations yet</p>
        <p class="empty-desc">Add a destination in Settings — any site you search often.</p>
        <button class="open-settings-btn" id="empty-add">Open Settings →</button>
      </div>
    </div>

    <script src="storage.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
